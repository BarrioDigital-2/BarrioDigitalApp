services:
  mysql:
    image: mysql:8.4
    container_name: barriodigital-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barriodigital
    ports:
      - "3306:3306"
    volumes:
      - barriodigital_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  barriodigital_mysql_data:
